name: 构建发布包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-desktop:
    name: 构建桌面应用
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: deb
          - os: macos-latest
            platform: macos
            artifact: dmg
          - os: windows-latest
            platform: windows
            artifact: msi
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 启用桌面构建 (${{ matrix.platform }})
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: 构建桌面应用 (${{ matrix.platform }})
        run: flutter build ${{ matrix.platform }} --release

      - name: 查找构建产物
        id: find-artifacts
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux)   DIR="build/linux/release/bundle" ;;
            macos)   DIR="build/macos/Build/Products/Release" ;;
            windows) DIR="build/windows/x64/runner/Release" ;;
          esac
          ARTIFACT=$(find "$DIR" -maxdepth 2 \( -name "*.deb" -o -name "*.dmg" -o -name "*.msi" -o -name "*.zip" -o -name "*.exe" \) | head -n 1)
          if [ -z "$ARTIFACT" ]; then
            echo "未在 $DIR 找到构建产物" >&2
            exit 1
          fi
          echo "artifact_path=$ARTIFACT" >> $GITHUB_OUTPUT
          echo "artifact_name=$(basename "$ARTIFACT")" >> $GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-${{ matrix.platform }}
          path: ${{ steps.find-artifacts.outputs.artifact_path }}
          retention-days: 30

  build-android:
    name: 构建 Android 应用
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 解码 Keystore
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > release.keystore

      - name: 构建签名的 Release APK
        run: flutter build apk --release \
          -Pandroid.injected.signing.store.file=release.keystore \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: 查找 Release APK
        id: find-apk
        shell: bash
        run: |
          ARTIFACT=$(find build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          if [ -z "$ARTIFACT" ]; then
            echo "未找到构建出的 APK" >&2
            exit 1
          fi
          echo "artifact_path=$ARTIFACT" >> $GITHUB_OUTPUT

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: iptv-player-android-release
          path: ${{ steps.find-apk.outputs.artifact_path }}
          retention-days: 30

  create-release:
    name: 创建 GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}